<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채용 공고 목록 - jobprep</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">jobprep</a>
    <nav aria-label="주 메뉴">
      <a href="index.html" aria-current="page">채용 공고</a>
      <a href="ask.html">취업 자료 질의응답</a>
    </nav>
  </header>

  <main>
    <h1>채용 공고</h1>
    <form id="filters" class="filters">
      <label>직무 분야
        <select id="field">
          <option value="">전체</option>
        </select>
      </label>
      <label>검색어
        <input id="keyword" type="search" placeholder="제목, 기업명, 본문">
      </label>
      <label class="check">
        <input id="only-favorites" type="checkbox"> 관심 공고만 보기
      </label>
      <button type="submit">찾기</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="job-list" class="job-list"></ul>
  </main>

  <footer class="site-footer">실습용 가상 자료로 만든 서비스이다. 공고와 기업은 실제가 아니다.</footer>

  <script src="js/common.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
