<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공고 상세 - jobprep</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">jobprep</a>
    <nav aria-label="주 메뉴">
      <a href="index.html">채용 공고</a>
      <a href="ask.html">취업 자료 질의응답</a>
    </nav>
  </header>

  <main>
    <p><a href="index.html">← 목록으로</a></p>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <article id="job" hidden>
      <h1 id="job-title"></h1>
      <p id="job-meta" class="job-meta"></p>
      <p id="job-deadline" class="job-deadline"></p>
      <div class="actions">
        <button id="favorite" type="button" aria-pressed="false">☆ 관심 공고</button>
        <button id="summarize" type="button">공고 요약</button>
      </div>

      <section id="summary" class="summary" hidden aria-labelledby="summary-heading">
        <h2 id="summary-heading">요약</h2>
        <h3>핵심 업무</h3>
        <ul id="sum-duties"></ul>
        <h3>자격 요건</h3>
        <ul id="sum-qualifications"></ul>
        <h3>마감일</h3>
        <p id="sum-deadline"></p>
        <h3>주의점</h3>
        <ul id="sum-cautions"></ul>
        <p id="sum-meta" class="note"></p>
      </section>

      <h2>공고 본문</h2>
      <pre id="job-description" class="description"></pre>
    </article>
  </main>

  <footer class="site-footer">실습용 가상 자료로 만든 서비스이다. 공고와 기업은 실제가 아니다.</footer>

  <script src="js/common.js"></script>
  <script src="js/job.js"></script>
</body>
</html>
