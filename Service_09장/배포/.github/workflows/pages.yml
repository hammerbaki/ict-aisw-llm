# GitHub Pages 배포 워크플로 (「LLM 서비스 개발」 9장 키트)
# 저장소 llm-service-lab 의 jobprep/web 을 GitHub Pages 로 내보낸다.
# 브랜치에서 바로 게시하는 방식은 저장소 맨 위(/)나 /docs 폴더만 고를 수 있으므로,
# 이 워크플로가 jobprep/web 에서 공개할 파일만 골라 _site 를 만들고 그것을 올린다.
# 사용 전: 저장소 Settings → Pages → Build and deployment → Source 를 「GitHub Actions」로 바꾼다.
# 액션의 주 버전은 2026-11-14 에 각 저장소의 최신 릴리스로 확인했다. 수업 전에 다시 확인한다.

name: Pages 배포

on:
  push:
    branches: [main]
    paths:
      - "jobprep/web/**"
      - "jobprep/tools/predeploy.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:        # Actions 탭에서 손으로 다시 돌릴 수 있게 한다

permissions:
  contents: read            # 저장소를 읽기만 한다
  pages: write              # Pages 에 배포한다
  id-token: write           # 배포 요청이 이 저장소의 워크플로에서 왔음을 증명한다

concurrency:
  group: pages
  cancel-in-progress: false # 진행 중인 배포는 끝까지 두고, 기다리는 것 중 가장 새것만 돈다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 정적 검사 (표준 라이브러리만 쓴다)
        run: python jobprep/web/check/check_static.py jobprep/web

      - name: 배포 전 점검과 공개 폴더 만들기
        run: python jobprep/tools/predeploy.py --src jobprep/web --out _site

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v6

      - name: 공개 폴더 올리기
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v5
