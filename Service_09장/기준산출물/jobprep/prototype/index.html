<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공고 목록 - jobprep</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="job-list">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="index.html">jobprep 취업 준비</a>
      <nav aria-label="주 메뉴">
        <ul class="nav-list">
          <li><a href="index.html" aria-current="page">공고</a></li>
          <li><a href="schedule.html">지원 관리</a></li>
          <li><a aria-disabled="true" title="10장에서 연다">자기소개서</a></li>
          <li><a aria-disabled="true" title="11장에서 연다">자료 묻기</a></li>
        </ul>
      </nav>
      <p class="utility"><a aria-disabled="true" title="이후 장에서 연다">설정</a></p>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <!-- SCR-01 공고 목록: REQ-001~007, REQ-028, REQ-029 -->
    <h1>채용 공고</h1>
    <p class="page-intro">마감일이 가까운 공고부터 보여요.</p>
    <form id="filter-form" class="filters" role="search" aria-label="공고 검색과 필터">
      <div class="field">
        <label for="q">검색어</label>
        <span class="hint" id="q-hint">공고 제목과 모집기관에서 찾아요</span>
        <input id="q" name="q" type="search" aria-describedby="q-hint" autocomplete="off">
      </div>
      <div class="field">
        <label for="status">상태</label>
        <select id="status" name="status">
          <option value="">전체</option><option>접수예정</option><option>접수중</option><option>마감</option>
        </select>
      </div>
      <div class="field">
        <label for="region">지역</label>
        <select id="region" name="region">
          <option value="">전체</option><option>서울</option><option>경기</option>
          <option>대전</option><option>부산</option>
        </select>
      </div>
      <div class="field">
        <label for="role">직무 분야</label>
        <select id="role" name="role">
          <option value="">전체</option><option>개발</option><option>운영</option><option>품질</option>
        </select>
      </div>
    </form>
    <p id="result-status" class="result-count" role="status" aria-live="polite"></p>
    <section id="result-area" aria-label="검색 결과">
      <ul id="job-list" class="card-list"></ul>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
