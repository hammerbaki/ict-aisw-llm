<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 일정 등록 - jobprep</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="schedule-new">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="index.html">jobprep 취업 준비</a>
      <nav aria-label="주 메뉴">
        <ul class="nav-list">
          <li><a href="index.html">공고</a></li>
          <li><a href="schedule.html" aria-current="page">지원 관리</a></li>
          <li><a aria-disabled="true" title="10장에서 연다">자기소개서</a></li>
          <li><a aria-disabled="true" title="11장에서 연다">자료 묻기</a></li>
        </ul>
      </nav>
      <p class="utility"><a aria-disabled="true" title="이후 장에서 연다">설정</a></p>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <!-- SCR-04 지원 일정 등록: REQ-009, REQ-010, REQ-026, REQ-031, REQ-039 -->
    <p><a class="back-link" href="schedule.html">지원 일정으로</a></p>
    <h1>지원 일정 등록</h1>
    <div id="error-summary" class="notice notice--error" role="alert" tabindex="-1" hidden></div>
    <form id="schedule-form" novalidate>
      <p class="page-intro">「필수」 표시가 있는 항목은 꼭 채워 주세요.</p>
      <div class="field">
        <label for="company">모집기관 <span class="req">(필수)</span></label>
        <input id="company" name="company" type="text" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="title">공고 제목 <span class="req">(필수)</span></label>
        <input id="title" name="title" type="text" required>
      </div>
      <div class="field">
        <label for="kind">일정 종류</label>
        <select id="kind" name="kind">
          <option>서류 마감</option><option>시험</option><option>면접</option><option>기타</option>
        </select>
      </div>
      <div class="field">
        <label for="date">날짜 <span class="req">(필수)</span></label>
        <span class="hint" id="date-hint">공고에서 왔으면 접수 마감일이 채워져 있어요</span>
        <input id="date" name="date" type="date" aria-describedby="date-hint" required>
      </div>
      <div class="field">
        <label for="memo">메모 <span class="req">(선택)</span></label>
        <span class="hint" id="memo-hint">100자까지 적을 수 있어요. 주민등록번호, 전화번호 같은 개인 정보는 적지 마세요. 메모는 이 브라우저에만 저장돼요.</span>
        <textarea id="memo" name="memo" rows="3" maxlength="100" aria-describedby="memo-hint"></textarea>
      </div>
      <p class="card__actions">
        <button type="submit" class="btn btn--primary">일정 저장</button>
        <a class="btn btn--secondary" href="schedule.html">취소</a>
      </p>
    </form>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
