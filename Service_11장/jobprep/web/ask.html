<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>취업 자료 질의응답</title>
  <link rel="stylesheet" href="ask.css">
</head>
<body>
  <main>
    <h1>취업 자료 질의응답</h1>
    <p class="note">학과 취업지원실의 자료(취업 지원 안내, 자기소개서 작성 가이드, 면접 준비 안내, 현장실습 운영 규정, 채용 공고)에서 근거를 찾아 답한다. 답의 [번호]는 아래 근거 목록의 번호다.</p>

    <form id="ask-form">
      <label for="question">질문</label>
      <textarea id="question" name="question" rows="2" maxlength="500" required
                placeholder="예: 현장실습 나가려면 몇 학점 이상 들어야 해?"></textarea>
      <div class="actions">
        <button type="submit" id="send">묻기</button>
        <button type="button" id="reset">대화 새로 시작</button>
      </div>
    </form>

    <section id="status" role="status" aria-live="polite"></section>

    <section id="result" hidden>
      <h2>답</h2>
      <p id="answer"></p>
      <p id="grounding" class="note"></p>
      <h2>근거</h2>
      <ol id="citations"></ol>
    </section>

    <section id="log-section" hidden>
      <h2>이 대화의 이전 질문</h2>
      <ul id="log"></ul>
    </section>
  </main>
  <script src="ask.js"></script>
</body>
</html>
