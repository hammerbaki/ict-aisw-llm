<!doctype html>
<!-- 11장 3-4의 예제. 접근성 문제를 일부러 넣은 메모 화면이다. 고친 판은 메모_고친예.html이다.
     html_check.py가 찾는 문제와 찾지 못하는 문제(대비, 초점 표시, 저장 알림)를 함께 두었다. -->
<html>
<head>
  <meta charset="utf-8">
  <title>메모</title>
  <style>
    body { background: #002b36; color: #829696; font-family: monospace; margin: 0; }
    textarea { width: 100%; height: 70vh; background: #002b36; color: #829696; border: 0; outline: none; }
    .status { color: #758d92; background: #1a404a; font-size: 0.875rem; }
    .icon { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div id="top">
    <img src="logo.png">
    <a href="help.html"><img src="help.svg"></a>
    <button><img src="gear.svg"></button>
  </div>
  <textarea id="memo" placeholder="여기에 적는다"></textarea>
  <div class="status" id="top">저장됨</div>
  <div onclick="clearMemo()">모두 지우기</div>
  <a href="#" tabindex="3">단축키</a>
  <script>
    function clearMemo() { document.getElementById("memo").value = ""; }
  </script>
</body>
</html>
