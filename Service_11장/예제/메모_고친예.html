<!doctype html>
<!-- 11장 3-4의 예제. 메모_나쁜예.html의 문제를 고친 판이다. html_check.py의 오류가 0건이다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>메모</title>
  <style>
    body { background: #002b36; color: #829696; font-family: monospace; margin: 0; padding: 1rem; }
    label { color: #d3dcdc; display: block; margin-bottom: 0.5rem; }
    textarea { width: 100%; height: 60vh; background: #002b36; color: #829696; border: 1px solid #829696; }
    textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #e0b04a; outline-offset: 2px; }
    .status { color: #c9d4d4; background: #1a404a; font-size: 0.875rem; padding: 0.25rem 0.5rem; }
    button, a { min-height: 2.75rem; color: #d3dcdc; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="">
    <a href="help.html">도움말</a>
    <button type="button" aria-label="설정">
      <img src="gear.svg" alt="">
    </button>
  </header>
  <main>
    <label for="memo">메모</label>
    <textarea id="memo" aria-describedby="memo-help"></textarea>
    <p id="memo-help">입력하는 대로 이 브라우저에 저장된다.</p>
    <p class="status" id="status" role="status">저장됨</p>
    <button type="button" onclick="clearMemo()">모두 지우기</button>
    <a href="#shortcuts">단축키</a>
  </main>
  <script>
    function clearMemo() { document.getElementById("memo").value = ""; }
  </script>
</body>
</html>
