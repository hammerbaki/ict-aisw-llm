<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채용 공고 목록 | 취업 준비 지원</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/list.js" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="site-name">취업 준비 지원</p>
    <nav aria-label="주 메뉴">
      <a href="index.html" aria-current="page">채용 공고</a>
      <a href="saved.html">관심 공고</a>
      <a href="schedule.html">지원 일정</a>
    </nav>
  </header>
  <main>
    <h1>채용 공고 목록</h1>
    <form id="search-form" class="filters" role="search">
      <div class="field">
        <label for="search-input">검색어</label>
        <input id="search-input" type="search" placeholder="제목, 기업에서 찾기">
      </div>
      <div class="field">
        <label for="filter-category">직무 분야</label>
        <select id="filter-category">
          <option value="">전체</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-region">지역</label>
        <select id="filter-region">
          <option value="">전체</option>
        </select>
      </div>
    </form>
    <p id="result-count" aria-live="polite">공고를 불러오는 중입니다.</p>
    <ul id="job-list" class="card-list"></ul>
    <div id="empty-state" class="empty" hidden>
      <p>조건에 맞는 공고가 없습니다.</p>
      <button id="reset-filters" type="button">조건 초기화</button>
    </div>
    <p id="load-error" class="error" role="alert" hidden></p>
  </main>
  <footer class="site-footer">
    <p>공고 자료는 수업을 위해 지어낸 것이다. 관심 공고와 지원 일정은 이 브라우저에만 저장된다.</p>
  </footer>
</body>
</html>
