<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 일정 | 취업 준비 지원</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/schedule.js" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="site-name">취업 준비 지원</p>
    <nav aria-label="주 메뉴">
      <a href="index.html">채용 공고</a>
      <a href="saved.html">관심 공고</a>
      <a href="schedule.html" aria-current="page">지원 일정</a>
    </nav>
  </header>
  <main>
    <h1>지원 일정</h1>
    <form id="schedule-form" class="schedule-form" novalidate>
      <div class="field">
        <label for="schedule-job">공고</label>
        <select id="schedule-job">
          <option value="">공고를 고르십시오</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule-stage">단계</label>
        <select id="schedule-stage">
          <option value="서류 마감">서류 마감</option>
          <option value="코딩 테스트">코딩 테스트</option>
          <option value="면접">면접</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule-date">날짜</label>
        <input id="schedule-date" type="date">
      </div>
      <div class="field field-wide">
        <label for="schedule-memo">메모 (선택, 100자 이내)</label>
        <input id="schedule-memo" type="text" maxlength="100" aria-describedby="memo-notice">
        <p id="memo-notice" class="notice">메모에는 주민등록번호, 전화번호, 계정 비밀번호 같은 개인 정보를 적지 않는다. 메모는 이 브라우저에 암호화되지 않은 채 저장된다.</p>
      </div>
      <button id="schedule-submit" type="submit">일정 추가</button>
      <p id="schedule-error" class="error" role="alert" hidden></p>
    </form>
    <h2>등록한 일정</h2>
    <ul id="schedule-list" class="schedule-list"></ul>
    <p id="schedule-empty" class="empty" hidden>등록한 지원 일정이 없습니다.</p>
  </main>
  <footer class="site-footer">
    <p>지원 일정은 이 브라우저에만 저장된다. 브라우저의 사이트 데이터를 지우면 함께 지워진다.</p>
  </footer>
</body>
</html>
