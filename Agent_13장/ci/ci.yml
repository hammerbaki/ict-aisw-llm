# jobprep 지속적 통합 워크플로 (「AI에이전트 기획 및 개발」 13장 키트)
# 저장소의 .github/workflows/ci.yml 로 복사해 쓴다.
#
# - PR과 main·agent/*(10장)·loop/*(8장) 푸시마다 네 검사를 따로 돌린다: test, eval, secrets, rules.
#   네 작업의 이름이 보호 규칙의 「필수 상태 검사」 이름이 된다.
# - API 키 없이 통과한다. LLM_FAKE=1(모의 모드)이고 secrets를 하나도 읽지 않는다.
# - 모든 작업이 .python-version의 파이썬을 쓴다(내 PC에서 잠금 파일을 만든 판과 같다).
# - 외부 액션은 커밋 SHA로 고정하고, 판 번호는 주석으로 남긴다.
#   SHA는 gh api repos/<소유자>/<저장소>/commits/<태그> 로 확인했다(2026-11-14, 2026-11-17). 수업 전에 다시 확인한다.
# - release.yml이 태그를 만들 때 이 워크플로를 그대로 다시 부른다(workflow_call).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/*", "loop/*"]
  workflow_dispatch:        # Actions 탭에서 손으로 다시 돌릴 수 있게 한다
  workflow_call:            # release.yml이 부른다

permissions:
  contents: read            # 저장소를 읽기만 한다. 나머지 권한은 모두 none이 된다

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # 같은 PR에 새 커밋이 오면 앞의 실행을 취소한다. main의 실행은 끝까지 둔다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLM_FAKE: "1"             # 실제 모델을 부르지 않는다
  EMBED_BACKEND: fallback   # Ollama 없이 대체 임베딩을 쓴다
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 뒤 단계가 토큰을 쓸 일이 없으므로 남기지 않는다

      - name: 파이썬 준비 (.python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 잠금 파일로 설치 (해시 검사)
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 테스트 (2장)
        run: python -m pytest -q

  eval:
    name: eval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 파이썬 준비 (.python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 잠금 파일로 설치 (해시 검사)
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 회귀 평가 (12장, 모의 모델)
        run: bash ops/ci/eval_gate.sh

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 파이썬 준비 (.python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 설치할 패키지가 없으므로 캐시를 쓰지 않는다

      - name: 비밀 정보 검사 (11장)
        run: python security/scan_secrets.py

  rules:
    name: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 파이썬 준비 (.python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version   # 설치할 패키지가 없으므로 캐시를 쓰지 않는다

      - name: 코드 규칙 검사 (3장)
        run: python ops/rules/check_code_rules.py

      - name: 버전 고정 검사 (13장)
        run: python ops/version/check_pins.py
